[project]
name = "app-automating"
# Single-sourced from src/app_automating/__init__.py (see [tool.hatch.version]).
# A release is one edit there, and the tag is checked against it in CI, so a
# tag and a wheel can never disagree about which version this is.
dynamic = ["version"]
description = "An MCP server that drives Android emulators and real devices, and remembers how it got there."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dkmostafa" }]
keywords = ["mcp", "android", "appium", "emulator", "testing", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "appium-python-client>=6.0.0",
    "fastmcp>=3.4.7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=16.6",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://github.com/dkmostafa/app-automating"
Repository = "https://github.com/dkmostafa/app-automating"
Issues = "https://github.com/dkmostafa/app-automating/issues"

# The console script an MCP client launches. `app-automating` with no arguments
# serves the tools over STDIO and speaks nothing else -- see src/app_automating/server.py.
[project.scripts]
app-automating = "app_automating.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/app_automating/__init__.py"

[tool.hatch.build.targets.wheel]
# One package, one name in site-packages. The import root is src/, and
# everything that ships lives under `app_automating/` -- modules/ is a
# subpackage of it rather than a top-level name of its own, because a
# distribution that claims `modules` in site-packages collides with the world.
packages = ["src/app_automating"]
# Tests are colocated with the code (Rule 2 §1), which is right for the repo and
# wrong for the wheel: an installing user gets no value from a suite that wants
# a real emulator, and they should not pay to download it.
exclude = ["**/tests/**"]

[tool.hatch.build.targets.sdist]
# The sdist carries what it takes to develop and verify the project, so the
# tests stay in: a source distribution nobody can run the suite against is not
# a source distribution.
include = ["src/", "README.md", "LICENSE", "CLAUDE.md", ".claude/rules/", "pyproject.toml"]

# This is the project's only pytest configuration. There is deliberately no
# pytest.ini and no setup.cfg: pytest reads exactly one of them, and a second
# file would silently switch off everything below.
#
#   uv run pytest                  everything, including a real emulator boot (~1 min)
#   uv run pytest -m unit          pure code only: no SDK, no device, no DB file, <1s
#   uv run pytest -m integration   the real toolchain: adb, avdmanager, Appium, a boot
#   uv run pytest -m "not integration"
#                                  what a machine with no Android SDK can run
#   uv run pytest src/app_automating/modules/android_module
#                                  one module, both kinds
#   uv run pytest src/app_automating/modules/<m>/tests/unit/test_architecture.py
#                                  the layer rules for one module, on any host
#
# Every test file carries `pytestmark` matching the directory it sits in, so the
# marker selections above and the paths agree by construction (Rule 2 §2). What
# separates the two is what the code under test *touches*, not how long it
# takes: a pure parser is a unit test against a 200-line sample, and a store
# tested against tmp_path is an integration test that finishes in a millisecond.
#
# Integration tests drive this host for real. They boot emulators, start Appium
# servers and write real files, they clean up after themselves, and they skip
# with a reason rather than failing on a machine that cannot run them. Running
# them is the developer's call -- see CLAUDE.md.
[tool.pytest.ini_options]
# pytest-asyncio 1.x: without this, every async test needs an explicit marker.
asyncio_mode = "auto"
# Colocated tests import their module as modules.<pkg>...; src is the import root.
pythonpath = ["src"]
# Tests are colocated with the code they cover; there is no top-level tests/.
testpaths = ["src"]
markers = [
    "unit: no device, no network, no real DB file",
    "integration: drives the real thing -- real files, real host tools, real devices",
]
# --strict-markers turns a typo'd marker into an error rather than a silent
# selection of nothing, which is what makes the commented commands above true.
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
