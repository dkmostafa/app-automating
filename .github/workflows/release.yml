name: Release

# Publishes to PyPI when a `v*` tag is pushed.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this exact workflow in this exact repository, and PyPI accepts it
# because you told PyPI to. There is no API token in the repository secrets,
# which means there is none to leak, rotate or accidentally print. Setting it up
# is a one-time step on PyPI -- see the checklist in CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: TestPyPI
        type: choice
        options: [TestPyPI, PyPI]

permissions:
  contents: read

jobs:
  build:
    name: build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The version lives in src/app_automating/__init__.py and nowhere else.
      # A tag that disagrees with it would publish a wheel whose number does not
      # match the commit it came from, so it fails here instead.
      - name: The tag and the package must agree on the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import app_automating; print(app_automating.__version__)')"
          echo "tag says      $tagged"
          echo "package says  $packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $packaged"
            exit 1
          fi

      - name: Lint
        run: |
          uv run ruff check src main.py script.py
          uv run ruff format --check src main.py script.py

      - name: Unit and architecture tests
        run: uv run pytest -m unit

      - name: Build
        run: uv build

      - name: Check the metadata renders on PyPI
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'TestPyPI'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/app-automating
    permissions:
      id-token: write # the OIDC token; this is what replaces an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of a tag that already went out should not fail the release.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.target == 'PyPI'
    environment:
      # Give this environment a required reviewer in the repository settings and
      # every release stops here for a human to approve before it is public.
      name: pypi
      url: https://pypi.org/p/app-automating
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach the artifacts to the tag
    needs: pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
