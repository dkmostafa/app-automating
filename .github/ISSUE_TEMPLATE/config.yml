blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/dkmostafa/app-automating/security/advisories/new
    about: >
      Report privately through a draft advisory. Please do not open a public
      issue for a vulnerability.
  - name: Host setup help
    url: https://github.com/dkmostafa/app-automating/blob/main/README.md#installing-the-prerequisites
    about: >
      "No Android SDK", "no device attached" or a driver that will not install
      is usually a host setup question. The README has step-by-step
      prerequisites for Ubuntu, WSL2 and macOS -- and call
      appium_check_environment, which names what is missing and how to fix it.
